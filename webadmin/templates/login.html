{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block bare %}
<div class="login-wrap">
  <form class="login" method="post" action="/login">
    <div class="brand big"><span class="brand-mark">✦</span><span class="brand-text">{{ persona }} · Таро<small>управление ботом</small></span></div>
    {% if error %}<div class="flash err">{{ error }}</div>{% endif %}
    <label>Логин<input name="login" autocomplete="username" required autofocus></label>
    <label>Пароль<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn primary wide" type="submit">Войти</button>
  </form>
</div>
{% endblock %}
